set-option -sa terminal-overrides ",xterm*:Tc"
set-option -g history-limit 50000
set -g mouse on

unbind C-b
set -g prefix C-s
bind C-s send-prefix

# Enable vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Enable seamless pane navigation when in copy mode
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

set-option -g remain-on-exit on

set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'fabioluciano/tmux-powerkit'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tpm'

# Tokyo Night Theme via tmux-powerkit
set -g @tokyo-night-time '%H:%M'
set -g @tokyo-night-day '#a9b1d6'
set -g @tokyo-night-night '#414868'
set -g @tokyo-night-user 'on'

# Status bar configuration
set -g @tokyo-night-left-separator '█'
set -g @tokyo-night-right-separator '█'
set -g @tokyo-night-session-icon ''

# set vi-mode
set-window-option -g mode-keys vi
# keybindings
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

unbind r
bind r source-file ~/.tmux.conf \; display "Reloaded .tmux.conf" 

# This lines should be last
run '~/.tmux/plugins/tpm/tpm'

#:schema https://yazi-rs.github.io/schemas/keymap.json

[mgr]
prepend_keymap = [
	{ on = [ "g", "p" ], run = "cd ~/Projects",                          desc = "Go to Projects" },
	{ on = [ "g", "w" ], run = "cd ~/Projects/Websites/",                desc = "Go to Websites project folder" },
	{ on = [ "g", "s" ], run = "cd ~/Projects/Websites/setster-docker/",  desc = "Go to setster-docker project" },
	{ on = [ "g", "t" ], run = "cd ~/Projects/Websites/tapify/",          desc = "Go to tapify project" },
]

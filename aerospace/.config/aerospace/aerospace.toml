# AeroSpace - Tiling Window Manager for macOS
# https://github.com/nikitabobko/AeroSpace

# Start AeroSpace at login
start-at-login = true

# Keep SketchyBar synced with AeroSpace
after-startup-command = ['exec-and-forget sketchybar', 'exec-and-forget sketchybar --trigger aerospace_focus_change']
exec-on-workspace-change = ['/bin/bash', '-c', 'sketchybar --trigger aerospace_workspace_change FOCUSED_WORKSPACE=$AEROSPACE_FOCUSED_WORKSPACE']

# Normalizations
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

# Mouse follows focus
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']
on-focus-changed = ['move-mouse window-lazy-center', 'exec-and-forget sketchybar --trigger aerospace_focus_change']

# Layout settings
default-root-container-layout = 'tiles'
default-root-container-orientation = 'horizontal'

# Gaps between windows
[gaps]
inner.horizontal = 10
inner.vertical = 10
outer.left = 10
outer.bottom = 10
outer.top = [{ monitor."built-in" = 20 }, { monitor.main = 42 }, 40]
outer.right = 10

# Keep a predictable workspace split across two monitors
[workspace-to-monitor-force-assignment]
1 = 'main'
2 = 'main'
3 = 'main'
4 = 'main'
5 = 'main'
6 = 'secondary'
7 = 'secondary'
8 = 'secondary'
9 = 'secondary'

# Main keybindings (alt as modifier - similar to Hyprland's Super)
[mode.main.binding]

# Window focus (vim-style hjkl)
alt-h = 'focus left'
alt-j = 'focus down'
alt-k = 'focus up'
alt-l = 'focus right'

# Move windows (vim-style with shift)
alt-shift-h = 'move left'
alt-shift-j = 'move down'
alt-shift-k = 'move up'
alt-shift-l = 'move right'

# Resize windows
alt-minus = 'resize smart -50'
alt-equal = 'resize smart +50'

# Layout toggles
alt-f = 'fullscreen'
alt-shift-f = 'layout floating tiling'
alt-e = 'layout tiles horizontal vertical'
alt-shift-e = 'layout accordion horizontal vertical'

# Monitor navigation
alt-comma = 'focus-monitor prev'
alt-period = 'focus-monitor next'

# Move window to monitor
alt-shift-comma = 'move-node-to-monitor --focus-follows-window prev'
alt-shift-period = 'move-node-to-monitor --focus-follows-window next'

# Move workspace to monitor
alt-ctrl-comma = 'move-workspace-to-monitor --wrap-around prev'
alt-ctrl-period = 'move-workspace-to-monitor --wrap-around next'

# Workspaces 1-9
alt-1 = 'workspace 1'
alt-2 = 'workspace 2'
alt-3 = 'workspace 3'
alt-4 = 'workspace 4'
alt-5 = 'workspace 5'
alt-6 = 'workspace 6'
alt-7 = 'workspace 7'
alt-8 = 'workspace 8'
alt-9 = 'workspace 9'

# Move window to workspace
alt-shift-1 = 'move-node-to-workspace 1'
alt-shift-2 = 'move-node-to-workspace 2'
alt-shift-3 = 'move-node-to-workspace 3'
alt-shift-4 = 'move-node-to-workspace 4'
alt-shift-5 = 'move-node-to-workspace 5'
alt-shift-6 = 'move-node-to-workspace 6'
alt-shift-7 = 'move-node-to-workspace 7'
alt-shift-8 = 'move-node-to-workspace 8'
alt-shift-9 = 'move-node-to-workspace 9'

# Workspace navigation and monitor movement
alt-tab = 'workspace-back-and-forth'
alt-left = 'workspace prev'
alt-right = 'workspace next'
alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'
alt-shift-left = 'move-node-to-workspace prev'
alt-shift-right = 'move-node-to-workspace next'

# Window history and swapping
alt-backtick = 'focus-back-and-forth'
alt-ctrl-h = 'swap left'
alt-ctrl-j = 'swap down'
alt-ctrl-k = 'swap up'
alt-ctrl-l = 'swap right'

# Layout recovery and utility actions
alt-shift-minus = 'balance-sizes'
alt-shift-c = ['flatten-workspace-tree', 'layout tiles horizontal', 'balance-sizes']
alt-m = 'macos-native-minimize'
alt-shift-backslash = 'enable toggle'

# Close window (like Hyprland's killactive)
alt-q = 'close'

# Reload config
alt-shift-r = 'reload-config'

# Enter service mode for less common actions
alt-shift-semicolon = 'mode service'

# Service mode for additional commands
[mode.service.binding]
esc = ['reload-config', 'mode main']
r = ['flatten-workspace-tree', 'mode main']
f = ['layout floating tiling', 'mode main']
backspace = ['close-all-windows-but-current', 'mode main']

# Monitor actions from service mode
comma = ['focus-monitor prev', 'mode main']
period = ['focus-monitor next', 'mode main']
shift-comma = ['move-node-to-monitor --focus-follows-window prev', 'mode main']
shift-period = ['move-node-to-monitor --focus-follows-window next', 'mode main']
c = ['balance-sizes', 'mode main']
m = 'macos-native-minimize'
b = ['focus-back-and-forth', 'mode main']
d = ['enable toggle', 'mode main']

# Join with adjacent windows
alt-shift-h = ['join-with left', 'mode main']
alt-shift-j = ['join-with down', 'mode main']
alt-shift-k = ['join-with up', 'mode main']
alt-shift-l = ['join-with right', 'mode main']

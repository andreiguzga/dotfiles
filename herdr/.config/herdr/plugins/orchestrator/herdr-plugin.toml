id = "gzg.orchestrator"
name = "OpenCode Orchestrator Supervisor"
version = "0.2.0"
min_herdr_version = "0.9.0"
description = "Wake a registered coordinator and notify the user about owned worker attention events"
platforms = ["macos", "linux"]

[[startup]]
command = ["python3", "supervisor.py", "start"]

# Herdr lifecycle events are the bounded fallback when a harness never exposes a
# native request id. They are latched, deduplicated and reported like any other
# attention record, and they never delay the direct user notice.
[[events]]
on = "pane.agent_status_changed"
command = ["python3", "attention-event.py"]

[[events]]
on = "pane.agent_detected"
command = ["python3", "attention-event.py"]

[[actions]]
id = "start"
title = "Start supervisor"
command = ["python3", "supervisor.py", "start"]

[[actions]]
id = "pause"
title = "Pause coordinator wakeups"
command = ["python3", "supervisor.py", "pause"]

[[actions]]
id = "resume"
title = "Resume coordinator wakeups"
command = ["python3", "supervisor.py", "resume"]

[[actions]]
id = "pending"
title = "Show pending attention events"
command = ["python3", "supervisor.py", "pending"]
